<h1 class="title">{{ isEdit ? 'Edit category' : 'New category' }}</h1>
<form [formGroup]="form" (ngSubmit)="submit()">
  <mat-form-field><mat-label>Name</mat-label>
    <input matInput formControlName="name">
    @if (form.controls.name.hasError('required')) { <mat-error>Name is required</mat-error> }
  </mat-form-field>
  <button mat-raised-button type="submit" [disabled]="form.invalid">{{ isEdit ? 'Update' : 'Create' }}</button>
</form>
