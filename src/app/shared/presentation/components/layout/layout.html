<mat-sidenav-container class="layout-container">
  <mat-sidenav mode="side" opened [class.collapsed]="collapsed()" class="sidenav">
    <div class="brand">
      <button mat-icon-button (click)="toggleMenu()" aria-label="Toggle navigation">
        <mat-icon>menu</mat-icon>
      </button>
      @if (!collapsed()) {
        <span>TrailGo Outdoor Centers</span>
      }
    </div>

    <mat-nav-list>
      @for (option of options; track option.link) {
        <a mat-list-item [routerLink]="option.link" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">
          <mat-icon matListItemIcon>{{ option.icon }}</mat-icon>
          @if (!collapsed()) {
            <span matListItemTitle>{{ option.label }}</span>
          }
        </a>
      }
    </mat-nav-list>
    <mat-nav-list>
      @for (option of options; track option.link) {
        <mat-button-toggle-group name="fontStyle" aria-label="Font Style">
          <mat-button-toggle value="EN">Bold</mat-button-toggle>
          <mat-button-toggle value="ES">Italic</mat-button-toggle>
        </mat-button-toggle-group>
          @if (!collapsed()) {
            <span matListItemTitle>{{ option.label }}</span>
          }
      }
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content class="content-shell">
    <main class="page-content">
      <router-outlet/>
    </main>
    <app-footer-content/>
  </mat-sidenav-content>
</mat-sidenav-container>
